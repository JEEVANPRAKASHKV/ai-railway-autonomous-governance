# docker compose up --build   →  UI http://localhost:8501 · API http://localhost:8000/docs
services:
  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - path: .env
        required: false
    environment:
      RB_STATE_DIR: /app/runtime
    volumes:
      - governance-state:/app/runtime        # audit trail + lifecycle state survive restarts
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports: ["8501:8501"]
    restart: unless-stopped

volumes:
  governance-state:
