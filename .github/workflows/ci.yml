name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Test
        run: pytest -q
      - name: Import UI modules
        run: python -c "import ast,sys; [ast.parse(open(f).read()) for f in ('frontend/app.py','frontend/passenger.py','frontend/tower.py')]"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t railway-buddy:ci .
